<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>Share to Promise Tracker</title><style>body{font-family:Inter,system-ui;background:#eef2f7;color:#111827;margin:0;display:grid;place-items:center;min-height:100vh}.box{width:min(680px,94vw);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}textarea,input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9dee8;border-radius:10px;font:inherit}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #d9dee8}.muted{color:#667085}.card{margin-top:15px;padding:14px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="box"><h1>Capture message</h1><p class="muted">Shared from SMS, WhatsApp or another app. Nothing is saved until you approve it.</p><textarea id="message" rows="8" placeholder="Shared message"></textarea><div class="row"><input id="person" placeholder="Person / sender (optional)"><select id="direction"><option value="auto">Auto direction</option><option value="mine">I promised</option><option value="theirs">Promised to me</option></select></div><div class="actions"><button id="analyze" class="btn primary">Analyze promise</button><a href="/" class="btn secondary" style="text-decoration:none;color:#111827">Open dashboard</a></div><div id="result" class="card muted">Ready to analyze.</div></div><script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
const q=new URLSearchParams(location.search);document.getElementById('message').value=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join('\n').trim();
async function api(url,opts={}){const r=await fetch(url,{headers:{...(opts.body?{'Content-Type':'application/json'}:{})},...opts});const x=await r.json().catch(()=>({error:'Request failed'}));if(!r.ok)throw new Error(x.error||x.detail||'Request failed');return x}
let detection=null;
document.getElementById('analyze').onclick=async()=>{const out=document.getElementById('result'),btn=document.getElementById('analyze');btn.disabled=true;btn.textContent='Analyzing…';try{detection=await api('/api/ai/extract',{method:'POST',body:JSON.stringify({message:document.getElementById('message').value,person:document.getElementById('person').value,direction:document.getElementById('direction').value})});if(!detection.isPromise){out.innerHTML='<b>No clear promise detected.</b><p>You can edit the message and try again.</p>';return}out.innerHTML=`<b>${escapeHtml(detection.text)}</b><p>${escapeHtml(detection.person||'Unknown')} · ${escapeHtml(detection.dueDate||'No date')} · ${detection.confidence||0}% confidence</p><p>${escapeHtml(detection.followUp||'')}</p><button id="save" class="btn primary">Add to tracker</button>`;document.getElementById('save').onclick=save}catch(e){out.innerHTML=`<b>${escapeHtml(e.message)}</b><p>If this says Authentication required, open the dashboard, sign in, then share the message again.</p>`}finally{btn.disabled=false;btn.textContent='Analyze promise'}};
async function save(){try{await api('/api/promises',{method:'POST',body:JSON.stringify({person:detection.person||document.getElementById('person').value||'Unknown',direction:detection.direction||'theirs',text:detection.text,dueDate:detection.dueDate||new Date().toISOString().slice(0,10),dueTime:detection.dueTime||'',amount:detection.amount||0,currency:detection.currency||'INR',notes:`Shared mobile message\nOriginal: ${document.getElementById('message').value}`,source:'Mobile Share'})});document.getElementById('result').innerHTML='<b>Added to Promise Tracker.</b><p>You can close this window or open the dashboard.</p>'}catch(e){document.getElementById('result').innerHTML=`<b>${escapeHtml(e.message)}</b>`}}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
